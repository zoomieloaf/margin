<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../../dist/webview.css">
<style>body{--vscode-editor-background:#fff;--vscode-editor-foreground:#1c1f26}</style></head>
<body class="vscode-light"><div id="app"></div>
<script>
// A fake VS Code host: applies edits to its text, bumps the version and acks.
window.host = { text: window.__initialText ?? '', version: 1, posted: [], log: [] };
function send(m) { window.postMessage(m, '*'); }
function applyEdits(text, edits) { for (const e of [...edits].sort((a, b) => b.start - a.start)) text = text.slice(0, e.start) + e.text + text.slice(e.end); return text; }
function acquireVsCodeApi() {
  return {
    setState() {}, getState() { return null; },
    postMessage(m) {
      window.host.posted.push(m);
      if (m.type === 'ready') send({ type: 'init', text: window.host.text, version: window.host.version, mode: window.__mode ?? 'preview', settings: { outlineVisible: true }, baseUri: location.href });
      if (m.type === 'edit') {
        if (m.version !== window.host.version) { send({ type: 'reset', text: window.host.text, version: window.host.version }); return; }
        window.host.text = applyEdits(window.host.text, m.edits);
        window.host.version++;
        const ack = { type: 'ack', version: window.host.version, seq: m.seq };
        setTimeout(() => send(ack), 5);
      }
      if (m.type === 'resync') send({ type: 'reset', text: window.host.text, version: window.host.version });
    },
  };
}
</script>
<script src="../../dist/webview.js"></script>
</body></html>
